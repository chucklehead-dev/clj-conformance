name: Clojure conformance
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        default: all
        options: [all, pilot, corpus, jvm-versions, jolt-nightly]

permissions:
  contents: read

jobs:
  recipes:
    if: github.event_name == 'schedule' || inputs.suite != 'corpus'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: chucklehead-dev/jolt-hegel/.github/actions/setup-jolt@83740a1124011f3e10b2bb822ffadc1c9996cb58
        with:
          version: '0.8.30'
          asset: jolt-v0.8.30-x86_64-linux.tar.gz
          sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
      - name: Generate shared vector recipes
        working-directory: packs/vector/generation
        run: |
          jolt -m hegel.install setup
          jolt generate.clj "$RUNNER_TEMP/recipes.edn" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: vector-recipes
          path: ${{ runner.temp }}/recipes.edn
  pilot:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'pilot'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - uses: chucklehead-dev/jolt-hegel/.github/actions/setup-jolt@83740a1124011f3e10b2bb822ffadc1c9996cb58
        with:
          version: '0.8.30'
          asset: jolt-v0.8.30-x86_64-linux.tar.gz
          sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
      - name: Run the dependency-free pilot with the pinned CLI's bundled Clojure
        run: |
          jar=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          test -f "$jar"
          PILOT_CLOJURE_JAR="$jar" bash pilot/compare.sh
          bash packs/vector/run.sh jolt -Scp packs/vector
          bash packs/vector/run.sh java -cp "$jar" clojure.main

  corpus:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'corpus'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - run: clojure -M test/conformance/certify.clj --self-test
      - run: clojure -M test/conformance/certify.clj --edn report.edn
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('report.edn') != ''
        with:
          name: jvm-corpus-report
          path: report.edn

  jvm-versions:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jvm-versions'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - run: bash pilot/jvm-versions.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-version-comparison
          path: target/jvm-versions/

  jolt-nightly:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jolt-nightly'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - name: Resolve and verify the official Linux nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/nightly "$RUNNER_TEMP/nightly"
          gh api repos/jolt-lang/jolt/releases/tags/vnightly > "$RUNNER_TEMP/release.json"
          jq -e '{commit:.target_commitish, release_id:.id, asset:(.assets[]|select(.name=="jolt-vnightly-x86_64-linux.tar.gz")|{id,name,digest})}' \
            "$RUNNER_TEMP/release.json" > target/nightly/build.json
          asset=$(jq -er .asset.id target/nightly/build.json)
          digest=$(jq -er .asset.digest target/nightly/build.json)
          gh api -H 'Accept: application/octet-stream' "repos/jolt-lang/jolt/releases/assets/$asset" > "$RUNNER_TEMP/nightly.tgz"
          echo "${digest#sha256:}  $RUNNER_TEMP/nightly.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nightly.tgz" -C "$RUNNER_TEMP/nightly" --strip-components=1
          "$RUNNER_TEMP/nightly/jolt" --version | tee target/nightly/version.txt
      - name: Compare nightly with JVM Clojure 1.12.3
        run: |
          export PILOT_CLOJURE_JAR=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          test -f "$PILOT_CLOJURE_JAR"
          JOLT="$RUNNER_TEMP/nightly/jolt" bash pilot/compare.sh 2>&1 | tee target/nightly/comparison.log
          bash packs/vector/run.sh "$RUNNER_TEMP/nightly/jolt" -Scp packs/vector
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jolt-nightly-comparison
          path: target/nightly/
