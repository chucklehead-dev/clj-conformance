name: Clojure conformance
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        default: all
        options: [all, pilot, corpus, jvm-versions, jolt-nightly, babashka-release, babashka-dev, jank, clr]

permissions:
  contents: read

jobs:
  jank:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jank'
    uses: ./.github/workflows/jank.yml
  clr:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'clr'
    needs: recipes
    uses: ./.github/workflows/clr.yml
    with:
      shared-recipes: true
  recipes:
    if: github.event_name == 'schedule' || contains(fromJSON('["all","pilot","jvm-versions","jolt-nightly","babashka-release","babashka-dev","clr"]'), inputs.suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: chucklehead-dev/jolt-hegel/.github/actions/setup-jolt@83740a1124011f3e10b2bb822ffadc1c9996cb58
        with:
          version: '0.8.30'
          asset: jolt-v0.8.30-x86_64-linux.tar.gz
          sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
      - name: Generate shared vector recipes
        working-directory: packs/vector/generation
        run: |
          jolt -m hegel.install setup
          jolt generate.clj "$RUNNER_TEMP/recipes.edn" "$GITHUB_RUN_ID"
      - name: Generate shared differential cases
        run: jolt -Scp packs/shared packs/shared/generate.clj "$GITHUB_RUN_ID" --library "$RUNNER_TEMP/shared.edn"
      - uses: actions/upload-artifact@v4
        with:
          name: vector-recipes
          path: |
            ${{ runner.temp }}/recipes.edn
            ${{ runner.temp }}/shared.edn
  pilot:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'pilot'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - uses: chucklehead-dev/jolt-hegel/.github/actions/setup-jolt@83740a1124011f3e10b2bb822ffadc1c9996cb58
        with:
          version: '0.8.30'
          asset: jolt-v0.8.30-x86_64-linux.tar.gz
          sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
      - name: Run the dependency-free pilot with the pinned CLI's bundled Clojure
        run: |
          jar=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          test -f "$jar"
          mkdir -p target/shared
          jolt -Scp packs/shared packs/shared/worker.clj target/vector/shared.edn jolt-release "$(jolt --version)" target/shared/jolt-release.edn
          PILOT_CLOJURE_JAR="$jar" bash pilot/compare.sh
          PILOT_CLOJURE_JAR="$jar" bash packs/native-regions/run.sh "$RUNNER_TEMP/native-regions"
          jolt -Scp packs/clojure-1.13 packs/clojure-1.13/siblings.clj "$GITHUB_RUN_ID" --probe
          bash packs/vector/run.sh jolt -Scp packs/vector
          bash packs/vector/run.sh java -cp "$jar" clojure.main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-jolt-release
          path: target/shared

  corpus:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'corpus'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - run: clojure -M packs/derivatives/common.cljc
      - run: clojure -M test/conformance/certify.clj --self-test
      - run: clojure -M test/conformance/certify.clj --edn report.edn
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('report.edn') != ''
        with:
          name: jvm-corpus-report
          path: report.edn

  jvm-versions:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jvm-versions'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - run: bash pilot/jvm-versions.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-version-comparison
          path: target/jvm-versions/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-jvm
          path: target/shared

  jolt-nightly:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jolt-nightly'
    needs: recipes
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - name: Resolve and verify the official Linux nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/nightly "$RUNNER_TEMP/nightly"
          gh api repos/jolt-lang/jolt/releases/tags/vnightly > "$RUNNER_TEMP/release.json"
          jq -e '{commit:.target_commitish, release_id:.id, asset:(.assets[]|select(.name=="jolt-vnightly-x86_64-linux.tar.gz")|{id,name,digest})}' \
            "$RUNNER_TEMP/release.json" > target/nightly/build.json
          asset=$(jq -er .asset.id target/nightly/build.json)
          digest=$(jq -er .asset.digest target/nightly/build.json)
          gh api -H 'Accept: application/octet-stream' "repos/jolt-lang/jolt/releases/assets/$asset" > "$RUNNER_TEMP/nightly.tgz"
          echo "${digest#sha256:}  $RUNNER_TEMP/nightly.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nightly.tgz" -C "$RUNNER_TEMP/nightly" --strip-components=1
          "$RUNNER_TEMP/nightly/jolt" --version | tee target/nightly/version.txt
      - name: Replay shared cases
        run: |
          mkdir -p target/shared
          "$RUNNER_TEMP/nightly/jolt" -Scp packs/shared packs/shared/worker.clj target/vector/shared.edn jolt-nightly "$(cat target/nightly/build.json)" target/shared/jolt-nightly.edn
      - name: Compare nightly with JVM Clojure 1.12.3
        run: |
          export PILOT_CLOJURE_JAR=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          test -f "$PILOT_CLOJURE_JAR"
          JOLT="$RUNNER_TEMP/nightly/jolt" bash pilot/compare.sh 2>&1 | tee target/nightly/comparison.log
          "$RUNNER_TEMP/nightly/jolt" -Scp packs/clojure-1.13 packs/clojure-1.13/siblings.clj "$GITHUB_RUN_ID" --probe 2>&1 | tee target/nightly/siblings.log
          bash packs/vector/run.sh "$RUNNER_TEMP/nightly/jolt" -Scp packs/vector
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jolt-nightly-comparison
          path: target/nightly/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-jolt-nightly
          path: target/shared

  babashka:
    if: github.event_name == 'schedule' || contains(fromJSON('["all","babashka-release","babashka-dev"]'), inputs.suite)
    needs: recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.suite == 'babashka-release' && '["release"]' || inputs.suite == 'babashka-dev' && '["dev"]' || '["release","dev"]') }}
    env:
      VECTOR_RECIPES: target/vector/recipes.edn
      BB_DIR: target/babashka/${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/vector
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - name: Resolve and verify Babashka
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: bash pilot/install-babashka.sh "$CHANNEL" "$BB_DIR"
      - name: Replay shared cases
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          mkdir -p target/shared
          "$BB_DIR/bb" packs/shared/worker.clj target/vector/shared.edn "bb-$CHANNEL" "$(cat "$BB_DIR/describe.edn")" "target/shared/bb-$CHANNEL.edn"
      - name: Run vector and sibling isolation properties
        run: |
          bash packs/vector/run.sh "$BB_DIR/bb" 2>&1 | tee "$BB_DIR/vector.log"
          "$BB_DIR/bb" packs/clojure-1.13/siblings.clj "$GITHUB_RUN_ID" --probe 2>&1 | tee "$BB_DIR/siblings.log"
        shell: bash
      - name: Compare numeric behavior with JVM Clojure 1.12.3
        run: |
          jar=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          java -cp "$jar" clojure.main -e '(assert (= "1.12.3" (clojure-version))) (load-file "pilot/numeric.clj")' > "$BB_DIR/jvm.numeric"
          "$BB_DIR/bb" pilot/numeric.clj > "$BB_DIR/bb.numeric"
          diff -u "$BB_DIR/jvm.numeric" "$BB_DIR/bb.numeric"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babashka-${{ matrix.channel }}-comparison
          path: |
            ${{ env.BB_DIR }}/*.json
            ${{ env.BB_DIR }}/*.edn
            ${{ env.BB_DIR }}/*.txt
            ${{ env.BB_DIR }}/*.log
            ${{ env.BB_DIR }}/*.numeric

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-bb-${{ matrix.channel }}
          path: target/shared

  differential:
    needs: [recipes, pilot, jvm-versions, jolt-nightly, babashka]
    if: always() && !cancelled() && needs.recipes.result == 'success' && inputs.suite != 'clr'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: vector-recipes
          path: target/fixtures
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-*
          merge-multiple: true
          path: target/shared
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: 1.12.3.1577
      - name: Compare observations and write standalone reproducers
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$SUITE" in
            all) builds=(jvm-baseline jvm-stable jvm-candidate jolt-release jolt-nightly bb-release bb-dev) ;;
            pilot) builds=(jolt-release) ;;
            jvm-versions) builds=(jvm-baseline jvm-stable jvm-candidate) ;;
            jolt-nightly) builds=(jolt-nightly) ;;
            babashka-release) builds=(bb-release) ;;
            babashka-dev) builds=(bb-dev) ;;
          esac
          reports=()
          for build in "${builds[@]}"; do reports+=("target/shared/$build.edn"); done
          jar=$(find "$CLOJURE_INSTALL_DIR" -name clojure-tools-1.12.3.1577.jar -print -quit)
          java -cp "$jar" clojure.main packs/shared/compare.clj target/fixtures/shared.edn target/comparison "${reports[@]}"
      - name: Publish shared property results in the run summary
        if: always() && hashFiles('target/comparison/coverage.md') != ''
        run: cat target/comparison/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-comparison
          path: target/comparison
